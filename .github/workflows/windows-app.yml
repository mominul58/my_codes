name: Windows desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-build.lock
      - name: Install verified dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock -r requirements-build.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Test Python 3.13 app and launcher
        run: python -m pytest -q
      - name: Verify Windows installer with Python 3.13
        shell: cmd
        run: INSTALL_WINDOWS.bat --no-pause
      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean PaveForge.spec
      - name: Smoke test frozen mesh engine
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'mesh-self-test.json'
          $app = Start-Process 'dist/PaveForge/PaveForge.exe' -ArgumentList '--self-test', '--self-test-report', $report -PassThru
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw 'Frozen mesh self-test timed out' }
          if (Test-Path $report) { Get-Content $report }
          if ($app.ExitCode -ne 0) { throw "Frozen mesh self-test failed: $($app.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'ok' -or -not $result.frozen) { throw 'Frozen mesh report did not pass' }
          Get-Content $report
      - name: Smoke test desktop window and dashboard
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'desktop-self-test.json'
          $app = Start-Process 'dist/PaveForge/PaveForge.exe' -ArgumentList '--desktop-smoke-report', $report -PassThru
          if (-not $app.WaitForExit(150000)) { $app.Kill(); throw 'Desktop smoke test timed out' }
          if (Test-Path $report) { Get-Content $report }
          if ($app.ExitCode -ne 0) { throw "Desktop smoke test failed: $($app.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'ok' -or $result.http_health -ne 'ok') { throw 'Dashboard readiness failed' }
          Get-Content $report
      - name: Package portable app
        shell: pwsh
        run: |
          Copy-Item PORTABLE_README.txt dist/PaveForge/READ_ME_FIRST.txt
          Compress-Archive -Path dist/PaveForge -DestinationPath dist/PaveForge-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PaveForge-Windows
          path: dist/PaveForge-Windows.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic logs
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Copy-Item build/PaveForge/warn-PaveForge.txt diagnostics -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP/*self-test.json" diagnostics -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/PaveForge/logs/*.log" diagnostics -ErrorAction SilentlyContinue
          Get-ChildItem diagnostics -File | Where-Object { $_.Extension -in '.json', '.log' } | ForEach-Object {
            $text = (Get-Content $_.FullName -Tail 45) -join "`n"
            $escaped = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=$($_.Name)::$escaped"
          }
      - name: Save diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: diagnostics/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PaveForge-Windows
          path: release
      - name: Publish tested Windows app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-{0}', github.run_number) }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" release/PaveForge-Windows.zip --target "$RELEASE_COMMIT" --title "PaveForge Windows dashboard" --notes-file PORTABLE_README.txt
